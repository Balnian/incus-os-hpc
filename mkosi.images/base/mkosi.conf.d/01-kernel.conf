[Content]
# Default kernel package selection. The build can override this via the
# KERNEL_PACKAGE/KERNEL_HEADERS_PACKAGE environment variables when building
# an optimized CachyOS variant for x86-64-v3 / x86-64-v4 / zen4.
Packages=
    kmod
    linux-image-zabbly
    systemd-boot-efi
BuildPackages=
    gcc
    libelf1
    linux-zabbly
Bootable=false
